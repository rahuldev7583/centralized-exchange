name: Build and Deploy Exchange to GCP

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: main-deployment

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            repository: exchange-web
          - app: core-backend
            repository: exchange-core-backend
          - app: matching-engine
            repository: exchange-matching-engine
          - app: risk-engine
            repository: exchange-risk-engine
          - app: db-worker
            repository: exchange-db-worker
          - app: oracle-service
            repository: exchange-oracle-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GCP_PROJECT_ID" || {
            echo "::error::GCP_PROJECT_ID is missing"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing"
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Validate web build variables
        if: matrix.app == 'web'
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$NEXT_PUBLIC_API_URL" || {
            echo "::error::NEXT_PUBLIC_API_URL is not configured"
            exit 1
          }

          test -n "$NEXT_PUBLIC_WS_URL" || {
            echo "::error::NEXT_PUBLIC_WS_URL is not configured"
            exit 1
          }

      - name: Build and push application image
        env:
          APP: ${{ matrix.app }}
          IMAGE_NAME: ${{ matrix.repository }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building ${IMAGE}"

          if [ "$APP" = "web" ]; then
            docker build \
              --build-arg APP="$APP" \
              --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              --build-arg NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL" \
              --tag "$IMAGE" \
              .
          else
            docker build \
              --build-arg APP="$APP" \
              --tag "$IMAGE" \
              .
          fi

          docker push "$IMAGE"

  deploy:
    name: Deploy to GCP VM
    needs: build
    runs-on: ubuntu-latest
    environment: main-deployment

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      GCP_ZONE: us-central1-a
      GCP_VM_NAME: instance-20261027-100435
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      VERSION: ${{ github.sha }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GCP_PROJECT_ID" || {
            echo "::error::GCP_PROJECT_ID is missing"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing"
            exit 1
          }

          test -n "$VERSION" || {
            echo "::error::VERSION is empty"
            exit 1
          }

          echo "Project: $GCP_PROJECT_ID"
          echo "Zone: $GCP_ZONE"
          echo "VM: $GCP_VM_NAME"
          echo "Registry: $IMAGE_REGISTRY"
          echo "Version: $VERSION"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          # This script runs on the VM as rahul-dev.
          # Its arguments are passed separately through SSH.
          REMOTE_SCRIPT="$(cat <<'REMOTE_EOF'
          set -eu

          echo "Connected user: $(whoami)"

          cd /opt/exchange

          echo "Working directory: $(pwd)"

          for file in \
            docker-compose.prod.yml \
            docker-compose.postgres.yml \
            .env
          do
            if [ ! -f "$file" ]; then
              echo "Required file is missing: $file"
              exit 1
            fi
          done

          test -r .env || {
            echo "Cannot read /opt/exchange/.env"
            exit 1
          }

          test -w .env || {
            echo "Cannot write /opt/exchange/.env"
            exit 1
          }

          REGISTRY="$1"
          IMAGE_VERSION="$2"
          REGION="$3"

          export IMAGE_REGISTRY="$REGISTRY"
          export VERSION="$IMAGE_VERSION"

          echo "Configuring Artifact Registry authentication..."

          # Use the VM's attached Google Cloud identity.
          # Do not copy GitHub credentials or service-account keys here.
          gcloud auth print-access-token >/dev/null

          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

          echo "Updating deployment variables..."

          sed -i \
            '/^VERSION=/d; /^IMAGE_REGISTRY=/d' \
            .env

          printf 'IMAGE_REGISTRY=%s\nVERSION=%s\n' \
            "$REGISTRY" "$IMAGE_VERSION" >> .env

          chmod 600 .env

          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml"

          echo "Validating Docker Compose configuration..."

          $COMPOSE config --quiet

          echo "Pulling application images..."

          $COMPOSE pull

          echo "Starting PostgreSQL..."

          $COMPOSE up -d postgres

          echo "Waiting for PostgreSQL to become healthy..."

          POSTGRES_ID="$($COMPOSE ps -q postgres)"

          if [ -z "$POSTGRES_ID" ]; then
            echo "PostgreSQL container was not found."
            $COMPOSE logs --tail=100 postgres
            exit 1
          fi

          POSTGRES_READY=0

          for i in $(seq 1 30); do
            STATUS="$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "$POSTGRES_ID")"

            echo "PostgreSQL status: $STATUS ($i/30)"

            if [ "$STATUS" = "healthy" ]; then
              POSTGRES_READY=1
              break
            fi

            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              echo "PostgreSQL stopped unexpectedly."
              break
            fi

            sleep 2
          done

          if [ "$POSTGRES_READY" -ne 1 ]; then
            echo "PostgreSQL did not become healthy."
            $COMPOSE logs --tail=100 postgres
            exit 1
          fi

          echo "Starting application services..."

          $COMPOSE up -d --remove-orphans

          echo "Current container status:"

          $COMPOSE ps

          REMOTE_EOF
          )"

          # Encode the script to avoid nested-heredoc and shell-quoting
          # problems when transmitting it through gcloud compute ssh.
          REMOTE_SCRIPT_B64="$(
            printf '%s' "$REMOTE_SCRIPT" | base64 -w 0
          )"

          printf -v REMOTE_ARGS '%q ' \
            "$IMAGE_REGISTRY" \
            "$VERSION" \
            "$GCP_REGION"

          echo "Deploying version: $VERSION"

          gcloud compute ssh "rahul-dev@$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet \
            --command="printf '%s' '$REMOTE_SCRIPT_B64' | base64 -d | bash -s -- $REMOTE_ARGS"

      - name: Check backend health
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_SCRIPT="$(cat <<'HEALTH_EOF'
          set -eu

          cd /opt/exchange

          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.postgres.yml"

          for i in $(seq 1 30); do
            if curl --connect-timeout 3 --max-time 5 -fsS \
              http://localhost:5000/api/health
            then
              echo
              echo "Backend is healthy."
              exit 0
            fi

            echo "Waiting for backend: $i/30"
            sleep 5
          done

          echo "Backend health check failed."
          $COMPOSE ps
          $COMPOSE logs --tail=100 core-backend

          exit 1
          HEALTH_EOF
          )"

          HEALTH_SCRIPT_B64="$(
            printf '%s' "$HEALTH_SCRIPT" | base64 -w 0
          )"

          echo "Checking backend health on the VM..."

          gcloud compute ssh "rahul-dev@$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet \
            --command="printf '%s' '$HEALTH_SCRIPT_B64' | base64 -d | bash"
