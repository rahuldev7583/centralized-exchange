name: Build and Deploy Exchange to GCP

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  GCP_VM_NAME: instance-20261027-100435
  AR_REPOSITORY: exchange

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: main-deployment

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            repository: exchange-web

          - app: core-backend
            repository: exchange-core-backend

          - app: matching-engine
            repository: exchange-matching-engine

          - app: risk-engine
            repository: exchange-risk-engine

          - app: db-worker
            repository: exchange-db-worker

          - app: oracle-service
            repository: exchange-oracle-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Validate web build variables
        if: matrix.app == 'web'
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || {
            echo "NEXT_PUBLIC_API_URL is not configured"
            exit 1
          }

          test -n "$NEXT_PUBLIC_WS_URL" || {
            echo "NEXT_PUBLIC_WS_URL is not configured"
            exit 1
          }

      - name: Build application image
        env:
          APP: ${{ matrix.app }}
          IMAGE_NAME: ${{ matrix.repository }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          if [ "$APP" = "web" ]; then
            docker build \
              --build-arg APP="$APP" \
              --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              --build-arg NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL" \
              --tag "$IMAGE" \
              .
          else
            docker build \
              --build-arg APP="$APP" \
              --tag "$IMAGE" \
              .
          fi

          docker push "$IMAGE"

  deploy:
    name: Deploy to GCP VM
    needs: build
    runs-on: ubuntu-latest
    environment: main-deployment

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy application
        env:
          VERSION: ${{ github.sha }}
        run: |
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}"

          gcloud compute ssh "$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet \
            --command="
              set -e
              cd /opt/exchange

              sed -i '/^VERSION=/d; /^IMAGE_REGISTRY=/d' .env

              printf 'IMAGE_REGISTRY=%s\nVERSION=%s\n' \
                '$REGISTRY' '$VERSION' >> .env

              gcloud auth configure-docker \
                '${GCP_REGION}-docker.pkg.dev' --quiet

              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                pull

              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                up -d postgres

              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                up -d --remove-orphans

              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                ps
            "

      - name: Check backend health
        run: |
          gcloud compute ssh "$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet \
            --command="
              set -e
              for i in \$(seq 1 30); do
                if curl -fsS http://localhost:5000/api/health; then
                  echo 'Backend is healthy'
                  exit 0
                fi
                echo \"Waiting for backend: \$i/30\"
                sleep 5
              done

              echo 'Backend health check failed'
              cd /opt/exchange
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                logs --tail=100 core-backend
              exit 1
            "
