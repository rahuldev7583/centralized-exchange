name: Build and Deploy Exchange to GCP

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: main-deployment

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            repository: exchange-web

          - app: core-backend
            repository: exchange-core-backend

          - app: matching-engine
            repository: exchange-matching-engine

          - app: risk-engine
            repository: exchange-risk-engine

          - app: db-worker
            repository: exchange-db-worker

          - app: oracle-service
            repository: exchange-oracle-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP configuration
        run: |
          set -euo pipefail

          test -n "$GCP_PROJECT_ID" || {
            echo "::error::GCP_PROJECT_ID is missing from main-deployment variables"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing from main-deployment variables"
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Validate web build variables
        if: matrix.app == 'web'
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          set -euo pipefail

          test -n "$NEXT_PUBLIC_API_URL" || {
            echo "::error::NEXT_PUBLIC_API_URL is not configured"
            exit 1
          }

          test -n "$NEXT_PUBLIC_WS_URL" || {
            echo "::error::NEXT_PUBLIC_WS_URL is not configured"
            exit 1
          }

      - name: Build application image
        env:
          APP: ${{ matrix.app }}
          IMAGE_NAME: ${{ matrix.repository }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "Building ${IMAGE}"

          if [ "$APP" = "web" ]; then
            docker build \
              --build-arg APP="$APP" \
              --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              --build-arg NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL" \
              --tag "$IMAGE" \
              .
          else
            docker build \
              --build-arg APP="$APP" \
              --tag "$IMAGE" \
              .
          fi

          docker push "$IMAGE"

  deploy:
    name: Deploy to GCP VM
    needs: build
    runs-on: ubuntu-latest
    environment: main-deployment

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      GCP_ZONE: us-central1-a
      GCP_VM_NAME: instance-20261027-100435
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      VERSION: ${{ github.sha }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          test -n "$GCP_PROJECT_ID" || {
            echo "::error::GCP_PROJECT_ID is missing"
            exit 1
          }

          test -n "$IMAGE_REGISTRY" || {
            echo "::error::IMAGE_REGISTRY is missing"
            exit 1
          }

          test -n "$VERSION" || {
            echo "::error::VERSION is empty"
            exit 1
          }

          echo "Project: $GCP_PROJECT_ID"
          echo "Zone: $GCP_ZONE"
          echo "VM: $GCP_VM_NAME"
          echo "Registry: $IMAGE_REGISTRY"
          echo "Version: $VERSION"

      - name: Deploy application
        run: |
          set -euo pipefail

          # Pass the values through the SSH command without relying on
          # environment variables being automatically available remotely.
          REMOTE_SCRIPT="$(cat <<'REMOTE_EOF'
          set -eu

          echo "Connected user: $(whoami)"

          cd /opt/exchange

          echo "Working directory: $(pwd)"

          test -f docker-compose.prod.yml || {
            echo "Missing docker-compose.prod.yml"
            exit 1
          }

          test -f docker-compose.postgres.yml || {
            echo "Missing docker-compose.postgres.yml"
            exit 1
          }

          test -f .env || {
            echo "Missing /opt/exchange/.env"
            exit 1
          }

          test -r .env || {
            echo "The SSH user cannot read .env"
            exit 1
          }

          test -w .env || {
            echo "The SSH user cannot write .env"
            exit 1
          }

          # IMAGE_REGISTRY and VERSION are passed to this script
          # as positional arguments.
          REGISTRY="$1"
          IMAGE_VERSION="$2"
          REGION="$3"

          export IMAGE_REGISTRY="$REGISTRY"
          export VERSION="$IMAGE_VERSION"

          # Update only the deployment variables; preserve application
          # configuration such as DATABASE_URL and REDIS_URL.
          sed -i '/^VERSION=/d; /^IMAGE_REGISTRY=/d' .env

          printf 'IMAGE_REGISTRY=%s\nVERSION=%s\n' \
            "$REGISTRY" "$IMAGE_VERSION" >> .env

          chmod 600 .env

          echo "Validating Docker Compose configuration..."

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.postgres.yml \
            config --quiet

          echo "Pulling application images..."

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.postgres.yml \
            pull

          echo "Starting PostgreSQL..."

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.postgres.yml \
            up -d postgres

          echo "Waiting for PostgreSQL to become healthy..."

          for i in $(seq 1 30); do
            STATUS="$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "$(docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                ps -q postgres)")"

            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL is healthy"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become healthy"
              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                logs --tail=100 postgres
              exit 1
            fi

            sleep 2
          done

          echo "Starting application services..."

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.postgres.yml \
            up -d --remove-orphans

          echo "Running containers:"

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.postgres.yml \
            ps
          REMOTE_EOF
          )"

          # Pass the script and arguments to the remote shell.
          # The VM uses its attached service account to access Artifact Registry.
          printf -v REMOTE_COMMAND '%q ' \
            bash -s -- \
            "$IMAGE_REGISTRY" \
            "$VERSION" \
            "$GCP_REGION"

          REMOTE_COMMAND="${REMOTE_COMMAND}${REMOTE_SCRIPT}"

          gcloud compute ssh "rahul-dev@$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet \
            --command="bash -s -- $(printf '%q ' "$IMAGE_REGISTRY" "$VERSION" "$GCP_REGION") <<'REMOTE_SCRIPT'
          $REMOTE_SCRIPT
          REMOTE_SCRIPT"

      - name: Check backend health
        run: |
          set -euo pipefail

          gcloud compute ssh "rahul-dev@$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --quiet \
            --command="
              set -eu

              for i in \$(seq 1 30); do
                if curl -fsS http://localhost:5000/api/health; then
                  echo
                  echo 'Backend is healthy'
                  exit 0
                fi

                echo \"Waiting for backend: \$i/30\"
                sleep 5
              done

              echo 'Backend health check failed'

              cd /opt/exchange

              docker compose \
                -f docker-compose.prod.yml \
                -f docker-compose.postgres.yml \
                logs --tail=100 core-backend

              exit 1
            "
