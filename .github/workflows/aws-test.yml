name: AWS Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473123644309:role/github-actions-exchange
          aws-region: us-east-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR access
        run: |
          aws ecr describe-repositories --region us-east-1

      - name: Load production secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            EXCHANGE_PROD, dev/exchange
          parse-json-secrets: true

      - name: Test configuration
        run: |
          test -n "$EXCHANGE_PROD_DATABASE_URL"
          test -n "$EXCHANGE_PROD_REDIS_URL"
      
          echo "DATABASE_URL is loaded"
          echo "REDIS_URL is loaded"
          echo "Secrets loaded successfully"
