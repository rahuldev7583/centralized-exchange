name: Build and Deploy Exchange

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 473123644309.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: i-05ac2a173a204d771

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            repository: exchange-web

          - app: core-backend
            repository: exchange-core-backend

          - app: matching-engine
            repository: exchange-matching-engine

          - app: risk-engine
            repository: exchange-risk-engine

          - app: db-worker
            repository: exchange-db-worker

          - app: oracle-service
            repository: exchange-oracle-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473123644309:role/github-actions-exchange
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: matrix.app != 'web'
        run: |
          docker build \
            --build-arg APP=${{ matrix.app }} \
            --tag "${ECR_REGISTRY}/${{ matrix.repository }}:${GITHUB_SHA}" \
            .

      - name: Build web Docker image
        if: matrix.app == 'web'
        run: |
          docker build \
            --build-arg APP=web \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_WS_URL="${{ vars.NEXT_PUBLIC_WS_URL }}" \
            --tag "${ECR_REGISTRY}/${{ matrix.repository }}:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${ECR_REGISTRY}/${{ matrix.repository }}:${GITHUB_SHA}"

  deploy:
    name: Deploy to EC2
    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473123644309:role/github-actions-exchange
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through SSM
        env:
          VERSION: ${{ github.sha }}

        run: |
          echo "Deploying:"
          echo "  Version:  $VERSION"
          echo "  Instance: $EC2_INSTANCE_ID"
          echo "  Region:   $AWS_REGION"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"set -e\",
              \"cd /opt/exchange\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sed -i '/^VERSION=/d' .env\",
              \"echo VERSION=$VERSION >> .env\",
              \"docker compose -f docker-compose.prod.yml pull\",
              \"docker compose -f docker-compose.prod.yml up -d --remove-orphans\",
              \"docker compose -f docker-compose.prod.yml ps\",
              \"echo 'Waiting for core-backend...'\",
              \"for i in \$(seq 1 30); do if curl -fsS http://localhost:5000/api/health; then echo 'Core backend healthy'; exit 0; fi; echo 'Waiting for backend...' \$i/30; sleep 5; done\",
              \"echo 'Core backend failed health check'\",
              \"docker compose -f docker-compose.prod.yml logs --tail=100 core-backend\",
              \"exit 1\"
            ]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"
